services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: secretbox
      POSTGRES_PASSWORD: secretbox
      POSTGRES_DB: secretbox
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
