services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: manguito
      POSTGRES_PASSWORD: manguito
      POSTGRES_DB: manguito
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manguito"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
