name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/ci.yml'

      - name: Install uv
        if: steps.filter.outputs.api == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.filter.outputs.api == 'true'
        working-directory: api
        run: uv sync --frozen

      - name: Ruff check
        if: steps.filter.outputs.api == 'true'
        working-directory: api
        run: uv run ruff check .

      - name: Ruff format check
        if: steps.filter.outputs.api == 'true'
        working-directory: api
        run: uv run ruff format --check .

      - name: Mypy
        if: steps.filter.outputs.api == 'true'
        working-directory: api
        run: uv run mypy app

      - name: Pytest
        # testcontainers needs a Docker daemon; ubuntu-latest runners have one.
        if: steps.filter.outputs.api == 'true'
        working-directory: api
        run: uv run pytest -v

      - name: No API changes
        if: steps.filter.outputs.api != 'true'
        run: echo "No changes under api/; nothing to check."

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

      - name: Setup Node
        if: steps.filter.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm ci

      - name: ESLint
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm run lint

      - name: Typecheck
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm run typecheck

      - name: Vitest
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm test

      - name: Build
        if: steps.filter.outputs.web == 'true'
        working-directory: web
        run: npm run build

      - name: No web changes
        if: steps.filter.outputs.web != 'true'
        run: echo "No changes under web/; nothing to check."

  types-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend dependencies
        working-directory: api
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Regenerate types
        run: make types

      - name: Fail if the committed types are stale
        run: |
          if ! git diff --exit-code -- web/src/api/generated.ts; then
            echo "::error::web/src/api/generated.ts is stale. Run 'make types' and commit the result."
            exit 1
          fi

  deploy:
    needs: [api, web, types-drift]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        working-directory: api
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
