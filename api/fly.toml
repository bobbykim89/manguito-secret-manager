app = "manguito-secret-manager-api"
# sea was retired by Fly and cannot take new resources. sjc is the closest
# remaining US West region. Keep this near the Neon project's own region:
# every request makes a database round trip, so a cross country split adds
# real latency to all of them.
primary_region = "sjc"

[build]

[deploy]
  # Runs against Neon before the new machine takes traffic. This is what makes
  # the empty baseline revision worth having in SP1.
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
